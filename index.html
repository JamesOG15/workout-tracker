  };

  const DEFAULT_GROUP_NAMES = ['Chest', 'Back', 'Legs', 'Shoulders', 'Arms', 'Core', 'Other'];
  const STARTER_EXERCISES = [
    ['Barbell Bench Press', 'Chest'], ['Incline Dumbbell Press', 'Chest'], ['Cable Fly', 'Chest'],
    ['Lat Pulldown', 'Back'], ['Seated Cable Row', 'Back'], ['Barbell Row', 'Back'],
    ['Back Squat', 'Legs'], ['Leg Press', 'Legs'], ['Romanian Deadlift', 'Legs'], ['Leg Extension', 'Legs'], ['Leg Curl', 'Legs'],
    ['Overhead Press', 'Shoulders'], ['Dumbbell Lateral Raise', 'Shoulders'], ['Rear Delt Fly', 'Shoulders'],
    ['Barbell Curl', 'Arms'], ['Dumbbell Curl', 'Arms'], ['Tricep Pushdown', 'Arms'], ['Skull Crusher', 'Arms'],
    ['Cable Crunch', 'Core']
  ];

  const app = document.getElementById('app');
  let db = null;
  let data = null;
  let config = null;
  let currentScreen = { name: 'loading', params: {} };
  let screenStack = [];
  let currentTab = 'home';
  let modal = null;
  let toastTimer = null;
  let quietSyncTimer = null;
  let periodicSyncTimer = null;
  let retryTimer = null;
  let syncRunning = false;
  let pendingGithubRestore = null;
  let undoState = null;
  let lastSummaryWorkoutId = null;
  let templateDraft = null;
  let pendingStart = null;
  const collapsedExercises = new Set();

  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  }

  function nowIso() { return new Date().toISOString(); }
  function todayLocal() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function dateToLocalString(value, options = {}) {
    if (!value) return '';
    const d = /^\d{4}-\d{2}-\d{2}$/.test(value) ? new Date(`${value}T12:00:00`) : new Date(value);
    const { year = true, ...rest } = options;
    const format = { day: 'numeric', month: 'short', ...(year === false ? {} : { year: 'numeric' }), ...rest };
    return new Intl.DateTimeFormat('en-GB', format).format(d);
  }
  function dateTimeString(value) {
    if (!value) return 'Never';
    return new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(value));
  }
  function formatNumber(value, max = 2) {
    if (!Number.isFinite(Number(value))) return '0';
    return Number(value).toLocaleString('en-GB', { maximumFractionDigits: max });
  }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c]);
  }
  function deepClone(value) { return structuredClone ? structuredClone(value) : JSON.parse(JSON.stringify(value)); }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
  function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
  function isOnline() { return navigator.onLine !== false; }
  function safeFileName(name) { return name.replace(/[^a-z0-9-_]+/gi, '-').replace(/^-|-$/g, '').toLowerCase(); }
  function groupBy(arr, keyFn) { return arr.reduce((out, item) => ((out[keyFn(item)] ||= []).push(item), out), {}); }

  function makeDefaultData(includeStarters = false) {
    const ts = nowIso();
    const groups = DEFAULT_GROUP_NAMES.map((name, position) => ({ id: uuid(), name, position, isDefault: true, createdAt: ts, updatedAt: ts }));
    const exercises = includeStarters ? STARTER_EXERCISES.map(([name, groupName]) => ({
      id: uuid(), name, muscleGroupId: groups.find(g => g.name === groupName)?.id || groups.at(-1).id,
      permanentNote: null, isArchived: false, createdAt: ts, updatedAt: ts
    })) : [];
    return {
      schemaVersion: 1,
      dataRevision: 0,
      createdAt: ts,
      updatedAt: ts,
      settings: {
        weeklyTarget: 3,
        weekStartsOn: 'monday',
        showRir: false,
        defaultSetType: 'working',
        appearance: 'system',
        setRowDensity: 'comfortable',
        defaultChartRange: '3_months'
      },
      muscleGroups: groups,
      exercises,
      templates: [],
      workouts: [],
      bodyweightEntries: [],
      plannedBreakWeeks: [],
      weeklyTargets: []
    };
  }

  function makeDefaultConfig() {
    return {
      setupComplete: false,
      installDismissed: false,
      github: {
        connected: false,
        username: '',
        repo: 'workout-tracker',
        branch: 'main',
        path: 'data/workout-data.json',
        token: '',
        lastSha: null,
        lastRevision: null,
        lastHash: null,
        lastSyncedAt: null,
        pending: false,
        pendingChanges: 0,
        retryCount: 0,
        errorType: null,
        errorMessage: null
      },
      conflict: null
    };
  }

  function normaliseLoadedData(candidate) {
    if (!candidate || typeof candidate !== 'object' || Array.isArray(candidate)) return candidate;
    candidate.settings ||= {};
    candidate.settings.setRowDensity ||= 'comfortable';
    candidate.weeklyTargets = Array.isArray(candidate.weeklyTargets) ? candidate.weeklyTargets : [];
    candidate.plannedBreakWeeks = Array.isArray(candidate.plannedBreakWeeks) ? candidate.plannedBreakWeeks : [];
    return candidate;
  }

  function hasPersonalTrainingData(value = data) {
    return Boolean(value && (
      (value.workouts || []).some(w => w.status !== 'deleted') ||
      (value.templates || []).some(t => !t.deletedAt) ||
      (value.bodyweightEntries || []).some(b => !b.deletedAt)
    ));
  }

  function hasOnlyUntouchedStarterExercises(value = data) {
    if (!value || hasPersonalTrainingData(value)) return false;
    const starterNames = new Set(STARTER_EXERCISES.map(([name]) => name));
    const exercises = value.exercises || [];
    return exercises.length > 0 && exercises.length <= starterNames.size && exercises.every(ex => starterNames.has(ex.name) && !ex.permanentNote && !ex.isArchived);
  }

  function hasMeaningfulData(value = data) {
    if (!value) return false;
    if (hasPersonalTrainingData(value)) return true;
    const exercises = value.exercises || [];
    return exercises.length > 0 && !hasOnlyUntouchedStarterExercises(value);
  }

  function validateData(candidate) {
    candidate = normaliseLoadedData(candidate);
    const errors = [];
    if (!candidate || typeof candidate !== 'object' || Array.isArray(candidate)) errors.push('The backup root must be an object.');
    if (candidate?.schemaVersion !== 1) errors.push('Unsupported or missing schema version.');
    const arrays = ['muscleGroups', 'exercises', 'templates', 'workouts', 'bodyweightEntries', 'plannedBreakWeeks', 'weeklyTargets'];
    arrays.forEach(k => { if (!Array.isArray(candidate?.[k])) errors.push(`Missing ${k} array.`); });
    if (errors.length) return { valid: false, errors };
    const duplicateCheck = (items, label) => {
      const ids = new Set();
      items.forEach(item => { if (!item.id || ids.has(item.id)) errors.push(`Duplicate or missing ${label} ID.`); ids.add(item.id); });
    };
    duplicateCheck(candidate.muscleGroups, 'muscle group');
    duplicateCheck(candidate.exercises, 'exercise');
    duplicateCheck(candidate.templates, 'template');
    duplicateCheck(candidate.workouts, 'workout');
    duplicateCheck(candidate.bodyweightEntries, 'bodyweight');
    duplicateCheck(candidate.weeklyTargets, 'weekly target');
    const exerciseIds = new Set(candidate.exercises.map(x => x.id));
    candidate.workouts.forEach(w => {
      (w.exercises || []).forEach(we => {
        if (!exerciseIds.has(we.exerciseId)) errors.push(`Workout ${w.id} references a missing exercise.`);
        (we.sets || []).forEach(set => {
          if (!Array.isArray(set.segments) || set.segments.length === 0) errors.push(`Set ${set.id} has no segments.`);
          if (set.isCompleted) set.segments.forEach(seg => {
            if (!(Number(seg.weightKg) >= 0) || !(Number.isInteger(Number(seg.reps))) || Number(seg.reps) < 1) errors.push(`Completed set ${set.id} contains invalid values.`);
          });
        });
      });
    });
    candidate.templates.forEach(t => (t.exercises || []).forEach(te => { if (!exerciseIds.has(te.exerciseId)) errors.push(`Template ${t.id} references a missing exercise.`); }));
    if (candidate.workouts.filter(w => w.status === 'in_progress').length > 1) errors.push('More than one workout is in progress.');
    const dates = new Set();
    candidate.bodyweightEntries.filter(x => !x.deletedAt).forEach(x => { if (dates.has(x.date)) errors.push('More than one bodyweight entry uses the same date.'); dates.add(x.date); });
    return { valid: errors.length === 0, errors };
  }

  function applyTheme() {
    const theme = data?.settings?.appearance || 'system';
    document.documentElement.removeAttribute('data-theme');
    if (theme !== 'system') document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-density', data?.settings?.setRowDensity || 'comfortable');
  }

  async function openDatabase() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains(DATA_STORE)) d.createObjectStore(DATA_STORE);
        if (!d.objectStoreNames.contains(CONFIG_STORE)) d.createObjectStore(CONFIG_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function idbGet(store, key) {
    return new Promise((resolve, reject) => {
      const req = db.transaction(store, 'readonly').objectStore(store).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function idbPut(store, key, value) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function saveConfig() { await idbPut(CONFIG_STORE, CONFIG_KEY, config); }
  async function saveDataRaw() { await idbPut(DATA_STORE, APP_DATA_KEY, data); }

  async function initialise() {
    try {
      db = await openDatabase();
      const savedData = await idbGet(DATA_STORE, APP_DATA_KEY);
      const savedConfig = await idbGet(CONFIG_STORE, CONFIG_KEY);
      config = savedConfig ? { ...makeDefaultConfig(), ...savedConfig, github: { ...makeDefaultConfig().github, ...(savedConfig.github || {}) } } : makeDefaultConfig();
      if (savedData) {
        normaliseLoadedData(savedData);
        const check = validateData(savedData);
        if (!check.valid) {
          currentScreen = { name: 'dataError', params: { errors: check.errors } };
          data = makeDefaultData(false);
          render();
          return;
        }
        data = savedData;
        const migratedTargets = ensureHistoricalWeekTargets(data);
        if (migratedTargets) await saveDataRaw();
      } else {
        data = makeDefaultData(false);
        await saveDataRaw();
      }
      applyTheme();
      if (isIOS() && !isStandalone() && !config.installDismissed) currentScreen = { name: 'install', params: {} };
      else if (!config.setupComplete) currentScreen = { name: 'setup', params: { step: 1 } };
      else if (config.conflict) currentScreen = { name: 'conflict', params: {} };
      else currentScreen = { name: 'home', params: {} };
      render();
      startSyncInfrastructure();
      if (config.github.connected && isOnline()) setTimeout(() => syncNow('startup'), 800);
      if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
      setTimeout(() => purgeExpiredDeletedItems(), 1200);
    } catch (error) {
      app.innerHTML = `<div class="install-wrap"><div class="install-card"><div class="app-mark">!</div><h1>Workout Tracker could not open</h1><p class="muted">Your browser storage could not be accessed. No existing data has been changed.</p><pre class="conflict-copy">${escapeHtml(error?.message || String(error))}</pre><button class="primary-button full-width" onclick="location.reload()">Try again</button></div></div>`;
    }
  }

  async function commitData(mutator, options = {}) {
    const before = deepClone(data);
    try {
      mutator(data);
      data.dataRevision = Number(data.dataRevision || 0) + 1;
      data.updatedAt = nowIso();
      const check = validateData(data);
      if (!check.valid) throw new Error(check.errors.join(' '));
      await saveDataRaw();
      config.github.pending = true;
      config.github.pendingChanges = Number(config.github.pendingChanges || 0) + 1;
      config.github.errorType = null;
      await saveConfig();
      applyTheme();
      if (options.render !== false) render();
      if (options.sync !== false) scheduleSync();
    } catch (error) {
      data = before;
      showToast(`Could not save change: ${error.message}`);
      render();
      throw error;
    }
  }

  function navigate(name, params = {}, push = true) {
    if (push && currentScreen.name !== name) screenStack.push(currentScreen);
    currentScreen = { name, params };
    window.scrollTo({ top: 0, behavior: 'instant' });
    render();
  }
  function goBack() {
    currentScreen = screenStack.pop() || { name: currentTab, params: {} };
    render();
  }
  function switchTab(tab) {
    currentTab = tab;
    screenStack = [];
    const active = getActiveWorkout();
    currentScreen = tab === 'workout' ? { name: active ? 'activeWorkout' : 'startWorkout', params: active ? { workoutId: active.id } : {} } : { name: tab, params: {} };
    window.scrollTo({ top: 0, behavior: 'instant' });
    render();
  }

  function openModal(type, params = {}) { modal = { type, params }; render(); }
  function closeModal() { modal = null; render(); }

  function showToast(message, actionLabel = null, action = null, duration = 4200) {
    clearTimeout(toastTimer);
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<div class="grow">${escapeHtml(message)}</div>${actionLabel ? `<button type="button">${escapeHtml(actionLabel)}</button>` : ''}`;
    if (actionLabel) el.querySelector('button').onclick = () => { el.remove(); action?.(); };
    document.body.appendChild(el);
    toastTimer = setTimeout(() => el.remove(), duration);
  }

  function setUndo(label, undoFn) {
    undoState = { undoFn };
    showToast(label, 'Undo', async () => { if (undoState) { const fn = undoState.undoFn; undoState = null; await fn(); } }, 6500);
  }

  function renderBottomNav() {
    const activeWorkout = getActiveWorkout();
    return `<nav class="bottom-nav" aria-label="Main navigation"><div class="bottom-nav-inner">
      ${navButton('home', 'Home', ICONS.home)}
      ${navButton('workout', 'Workout', ICONS.workout, Boolean(activeWorkout))}
      ${navButton('progress', 'Progress', ICONS.progress)}
      ${navButton('more', 'More', ICONS.more)}
    </div></nav>`;
  }
  function navButton(tab, label, icon, dot = false) {
    const active = currentTab === tab || (tab === 'workout' && currentScreen.name === 'activeWorkout');
    return `<button class="nav-item ${active ? 'active' : ''}" data-action="switch-tab" data-tab="${tab}" aria-label="${label}">${dot ? '<span class="nav-dot"></span>' : ''}${icon}<span>${label}</span></button>`;
  }

  function pageHeader(title, subtitle = '', options = {}) {
    return `<header class="page-header ${options.compact ? 'compact' : ''}">
      ${options.back ? `<button class="back-button" data-action="back" aria-label="Back">${ICONS.back}</button>` : ''}
      <div class="page-title-block" style="flex:1"><h1>${escapeHtml(title)}</h1>${subtitle ? `<p>${options.subtitleHtml ? subtitle : escapeHtml(subtitle)}</p>` : ''}</div>
      ${options.action || ''}
    </header>`;
  }

  function statusInfo() {
    const gh = config.github;
    if (!gh.connected) return { label: 'Saved locally', cls: '' };
    if (syncRunning) return { label: 'Backing up', cls: '' };
    if (config.conflict) return { label: 'Backup needs attention', cls: 'danger' };
    if (!isOnline() && gh.pending) return { label: 'Offline - backup pending', cls: 'warning' };
    if (gh.errorType) return { label: gh.errorType === 'auth' ? 'GitHub connection expired' : 'Backup needs attention', cls: 'danger' };
    if (gh.pending) return { label: 'Saved locally', cls: 'warning' };
    return { label: 'Backed up to GitHub', cls: 'success' };
  }
  function statusPill() { const s = statusInfo(); return `<span class="status-pill ${s.cls}">${escapeHtml(s.label)}</span>`; }

  function getExercise(id) { return data.exercises.find(x => x.id === id); }
  function getGroup(id) { return data.muscleGroups.find(x => x.id === id); }
  function getTemplate(id) { return data.templates.find(x => x.id === id); }
  function getWorkout(id) { return data.workouts.find(x => x.id === id); }
  function getActiveWorkout() { return data.workouts.find(x => x.status === 'in_progress'); }
  function visibleTemplates() { return data.templates.filter(x => !x.isArchived && !x.deletedAt); }
  function completedWorkouts() { return data.workouts.filter(x => x.status === 'completed' && !x.deletedAt).sort((a,b) => b.workoutDate.localeCompare(a.workoutDate) || b.updatedAt.localeCompare(a.updatedAt)); }
  function visibleBodyweights() { return data.bodyweightEntries.filter(x => !x.deletedAt).sort((a,b) => a.date.localeCompare(b.date)); }
  function setVolume(set) { return set.isCompleted && set.setType === 'working' ? set.segments.reduce((sum, s) => sum + Number(s.weightKg || 0) * Number(s.reps || 0), 0) : 0; }
  function setReps(set) { return set.isCompleted && set.setType === 'working' ? set.segments.reduce((sum, s) => sum + Number(s.reps || 0), 0) : 0; }
  function workoutStats(workout) {
    let workingSets = 0, warmups = 0, reps = 0, volume = 0;
    (workout.exercises || []).forEach(we => (we.sets || []).forEach(set => {
      if (!set.isCompleted) return;
      if (set.setType === 'warm_up') warmups += 1;
      else { workingSets += 1; reps += setReps(set); volume += setVolume(set); }
    }));
    return { exercises: (workout.exercises || []).filter(we => we.sets?.some(s => s.isCompleted)).length, workingSets, warmups, reps, volume };
  }
  function exerciseStatsInWorkout(workout, exerciseId) {
    const we = workout.exercises.find(x => x.exerciseId === exerciseId);
    if (!we) return { sets: 0, reps: 0, volume: 0, heaviest: 0 };
    const working = we.sets.filter(s => s.isCompleted && s.setType === 'working');
    return {
      sets: working.length,
      reps: working.reduce((sum,s) => sum + setReps(s), 0),
      volume: working.reduce((sum,s) => sum + setVolume(s), 0),
      heaviest: Math.max(0, ...working.flatMap(s => s.segments.map(seg => Number(seg.weightKg || 0))))
    };
  }
  function getPreviousWorkoutsForExercise(exerciseId, currentWorkout, limit = 5) {
    return completedWorkouts().filter(w => {
      if (currentWorkout && w.id === currentWorkout.id) return false;
      if (currentWorkout && w.workoutDate > currentWorkout.workoutDate) return false;
      if (currentWorkout && w.workoutDate === currentWorkout.workoutDate && w.updatedAt >= currentWorkout.updatedAt) return false;
      return w.exercises.some(we => we.exerciseId === exerciseId && we.sets.some(s => s.isCompleted));
    }).slice(0, limit);
  }
  function formatSet(set) {
    return set.segments.map(seg => `${formatNumber(seg.weightKg)} kg x ${seg.reps || 0}`).join(' + ');
  }
  function completedWorkingSetCount(workout) { return workout.exercises.reduce((sum,we) => sum + we.sets.filter(s => s.isCompleted && s.setType === 'working').length, 0); }

  function getRecordsForExercise(exerciseId, excludeWorkoutId = null) {
    let heaviest = null, highestSet = null, highestSession = null;
    const byReps = {};
    completedWorkouts().filter(w => w.id !== excludeWorkoutId).forEach(w => {
      const we = w.exercises.find(x => x.exerciseId === exerciseId);
      if (!we) return;
      const sessionVolume = we.sets.reduce((sum,s) => sum + setVolume(s), 0);
      if (sessionVolume > 0 && (!highestSession || sessionVolume > highestSession.value)) highestSession = { value: sessionVolume, workoutId: w.id, date: w.workoutDate };
      we.sets.filter(s => s.isCompleted && s.setType === 'working').forEach(set => {
        const vol = setVolume(set);
        if (!highestSet || vol > highestSet.value) highestSet = { value: vol, workoutId: w.id, setId: set.id, date: w.workoutDate };
        set.segments.forEach(seg => {
          const weight = Number(seg.weightKg);
          const reps = Number(seg.reps);
          if (!heaviest || weight > heaviest.value) heaviest = { value: weight, reps, workoutId: w.id, date: w.workoutDate };
          if (!byReps[reps] || weight > byReps[reps].value) byReps[reps] = { value: weight, workoutId: w.id, date: w.workoutDate };
        });
      });
    });
    return { heaviest, highestSet, highestSession, byReps };
  }

  function getWorkoutRecords(workout) {
    const records = [];
    workout.exercises.forEach(we => {
      const ex = getExercise(we.exerciseId);
      const workingSets = we.sets.filter(s => s.isCompleted && s.setType === 'working');
      if (!workingSets.length) return;
      const historical = getRecordsForExercise(we.exerciseId, workout.id);
      const hasHistory = Boolean(historical.heaviest || historical.highestSet || historical.highestSession || Object.keys(historical.byReps).length);
      if (!hasHistory) {
        records.push({ exercise: ex?.name || 'Exercise', label: 'First result', baseline: true });
        return;
      }
      const stats = exerciseStatsInWorkout(workout, we.exerciseId);
      const bestSetVolume = Math.max(0, ...workingSets.map(setVolume));
      const currentByReps = {};
      workingSets.flatMap(set => set.segments).forEach(seg => {
        const reps = Number(seg.reps), weight = Number(seg.weightKg);
        if (!currentByReps[reps] || weight > currentByReps[reps]) currentByReps[reps] = weight;
      });
      if (stats.heaviest > (historical.heaviest?.value || 0)) records.push({ exercise: ex?.name || 'Exercise', label: `Heaviest weight: ${formatNumber(stats.heaviest)} kg` });
      if (stats.volume > (historical.highestSession?.value || 0)) records.push({ exercise: ex?.name || 'Exercise', label: `Highest session volume: ${formatNumber(stats.volume)} kg` });
      if (bestSetVolume > (historical.highestSet?.value || 0)) records.push({ exercise: ex?.name || 'Exercise', label: `Highest-volume set: ${formatNumber(bestSetVolume)} kg` });
      Object.entries(currentByReps).sort((a,b)=>Number(a[0])-Number(b[0])).forEach(([reps, weight]) => {
        if (weight > (historical.byReps[Number(reps)]?.value || 0)) records.push({ exercise: ex?.name || 'Exercise', label: `Best ${reps}-rep weight: ${formatNumber(weight)} kg` });
      });
    });
    return records;
  }


  function startOfWeek(dateValue, startsOn = data.settings.weekStartsOn) {
    const d = new Date(`${dateValue}T12:00:00`);
    const day = d.getDay();
    const target = startsOn === 'sunday' ? 0 : 1;
    const diff = (day - target + 7) % 7;
    d.setDate(d.getDate() - diff);
    return localDateFromDate(d);
  }
  function localDateFromDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function addDays(dateValue, count) {
    const d = new Date(`${dateValue}T12:00:00`); d.setDate(d.getDate() + count); return localDateFromDate(d);
  }
  function workoutCountsForConsistency(workout) {
    return workout.exercises.some(we => we.sets.some(s => s.isCompleted));
  }
  function workoutDaysForWeek(weekStart) {
    const end = addDays(weekStart, 6);
    return new Set(completedWorkouts().filter(w => workoutCountsForConsistency(w) && w.workoutDate >= weekStart && w.workoutDate <= end).map(w => w.workoutDate));
  }
  function plannedBreakForWeek(weekStart) { return data.plannedBreakWeeks.find(x => x.weekStartDate === weekStart); }
  function targetForWeek(weekStart = startOfWeek(todayLocal())) {
    return Number((data.weeklyTargets || []).find(x => x.weekStartDate === weekStart)?.target || data.settings.weeklyTarget || 3);
  }
  function ensureHistoricalWeekTargets(targetData = data) {
    targetData.weeklyTargets ||= [];
    let changed = false;
    const existing = new Set(targetData.weeklyTargets.map(x => x.weekStartDate));
    (targetData.workouts || []).filter(w => w.status === 'completed' && !w.deletedAt && w.exercises?.some(we => we.sets?.some(s => s.isCompleted))).forEach(w => {
      const week = startOfWeek(w.workoutDate, targetData.settings?.weekStartsOn || 'monday');
      if (!existing.has(week)) {
        targetData.weeklyTargets.push({ id: `weekly-${week}`, weekStartDate: week, target: Number(targetData.settings?.weeklyTarget || 3), kind: 'snapshot', createdAt: w.completedAt || w.updatedAt || nowIso(), updatedAt: w.completedAt || w.updatedAt || nowIso() });
        existing.add(week); changed = true;
      }
    });
    return changed;
  }
  function currentStreak() {
    const today = todayLocal();
    let week = startOfWeek(today);
    const currentDays = workoutDaysForWeek(week).size;
    if (currentDays < targetForWeek(week) && !plannedBreakForWeek(week)) week = addDays(week, -7);
    let streak = 0;
    for (let i = 0; i < 520; i++) {
      const planned = plannedBreakForWeek(week);
      if (planned) { week = addDays(week, -7); continue; }
      if (workoutDaysForWeek(week).size >= targetForWeek(week)) { streak++; week = addDays(week, -7); }
      else break;
    }
    return streak;
  }
  function latestBodyweight() { return visibleBodyweights().at(-1) || null; }
  function bodyweightRollingAverage(entries, date) {
    const start = addDays(date, -6);
    const vals = entries.filter(x => x.date >= start && x.date <= date).map(x => Number(x.weightKg));
    return vals.length ? vals.reduce((a,b) => a+b,0) / vals.length : null;
  }
  function bodyweightTrend() {
    const entries = visibleBodyweights();
    if (entries.length < 2) return null;
    const last = entries.at(-1);
    const cutoff = addDays(last.date, -30);
    const earlier = [...entries].reverse().find(x => x.date <= cutoff) || entries[0];
    const diff = Number(last.weightKg) - Number(earlier.weightKg);
    return { diff, label: `${diff >= 0 ? '+' : ''}${formatNumber(diff)} kg since ${dateToLocalString(earlier.date, { year: false })}` };
  }

  function renderSetRow(workout, we, set, index) {
    const workingNumber = set.setType === 'working' ? we.sets.filter((candidate, candidateIndex) => candidateIndex <= index && candidate.setType === 'working').length : null;
    return `<div class="set-row ${set.isCompleted ? 'completed' : ''} ${set.setType === 'warm_up' ? 'warmup' : ''}" data-set-id="${set.id}">
      <div class="set-main">
        <div class="set-index ${set.setType === 'warm_up' ? 'warmup' : ''}">${set.setType === 'warm_up' ? 'WU' : workingNumber}</div>
        <div>${set.segments.sort((a,b) => a.position-b.position).map((seg) => `<div class="segment-row">
          <input class="segment-input" aria-label="Weight in kilograms" type="number" inputmode="decimal" min="0" max="1000" step="0.25" placeholder="kg" value="${seg.weightKg ?? ''}" data-field="segment-weight" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}" data-seg-id="${seg.id}">
          <span class="segment-times">×</span>
          <input class="segment-input" aria-label="Repetitions" type="number" inputmode="numeric" min="1" max="1000" step="1" placeholder="reps" value="${seg.reps ?? ''}" data-field="segment-reps" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}" data-seg-id="${seg.id}">
          ${set.segments.length > 1 ? `<button class="segment-remove" data-action="remove-segment" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}" data-seg-id="${seg.id}" aria-label="Remove drop-set segment">×</button>` : '<span></span>'}
        </div>`).join('')}</div>
        <button class="complete-button ${set.isCompleted ? 'checked' : ''}" data-action="toggle-set-complete" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}" aria-label="${set.isCompleted ? 'Mark set incomplete' : 'Mark set complete'}">${set.isCompleted ? ICONS.check : ''}</button>
      </div>
      <div class="set-tools">
        <button class="mini-button" data-action="adjust-weight" data-delta="-2.5" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}">−2.5 kg</button>
        <button class="mini-button" data-action="adjust-weight" data-delta="2.5" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}">+2.5 kg</button>
        <button class="mini-button" data-action="adjust-reps" data-delta="-1" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}">−1 rep</button>
        <button class="mini-button" data-action="adjust-reps" data-delta="1" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}">+1 rep</button>
        <button class="mini-button" data-action="duplicate-set" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}">Duplicate</button>
        <button class="mini-button" data-action="add-segment" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}">+ Drop</button>
        <button class="mini-button danger" data-action="delete-set" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}">Delete</button>
      </div>
      <div class="set-detail-grid">
        <select class="select" data-field="set-type" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}"><option value="working" ${set.setType === 'working' ? 'selected' : ''}>Working set</option><option value="warm_up" ${set.setType === 'warm_up' ? 'selected' : ''}>Warm-up</option></select>
        ${data.settings.showRir ? `<input class="input" type="number" inputmode="numeric" min="0" max="10" placeholder="RIR" value="${set.rir ?? ''}" data-field="set-rir" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}">` : '<span></span>'}
        <input class="input" style="grid-column:1/-1" placeholder="Set note (optional)" value="${escapeHtml(set.note || '')}" data-field="set-note" data-workout-id="${workout.id}" data-we-id="${we.id}" data-set-id="${set.id}">
      </div>
    </div>`;
  }

  function renderFinishReview(workoutId) {
    const workout = getWorkout(workoutId);
    if (!workout) return renderStartWorkout();
    const incomplete = workout.exercises.flatMap(we => we.sets.filter(s => !s.isCompleted && s.segments.some(seg => seg.weightKg !== '' || seg.reps !== '')).map(s => ({ exercise: getExercise(we.exerciseId)?.name || 'Exercise', set: s })));
    if (!incomplete.length) {
      setTimeout(() => completeWorkout(workoutId, false), 0);
      return `<main class="page no-tabs">${pageHeader('Finishing Workout')}<div class="card"><p>Saving your workout…</p></div></main>`;
    }
    return `<main class="page no-tabs">${pageHeader('Review Workout', `${incomplete.length} incomplete set${incomplete.length === 1 ? '' : 's'}`, { back: true })}
      <div class="card warning flat"><strong>Some sets have values but are not marked complete.</strong><p class="small">Incomplete sets never affect progress or records.</p></div>
      <div class="list">${incomplete.map(x => `<div class="list-item"><div class="grow"><div class="list-item-title">${escapeHtml(x.exercise)}</div><div class="list-item-sub">${escapeHtml(formatSet(x.set))}</div></div><span class="tag">Incomplete</span></div>`).join('')}</div>
      <div class="sticky-actions"><div class="button-row"><button class="secondary-button" data-action="complete-workout" data-id="${workout.id}" data-remove="false">Keep in history</button><button class="primary-button" data-action="complete-workout" data-id="${workout.id}" data-remove="true">Remove and finish</button></div></div>
    </main>`;
  }

  function renderWorkoutSummary(workoutId) {
    const workout = getWorkout(workoutId);
    if (!workout) return renderHome();
    const stats = workoutStats(workout);
    const records = getWorkoutRecords(workout);
    const previousSameTemplate = workout.templateId ? completedWorkouts().find(w => w.id !== workout.id && w.templateId === workout.templateId && w.workoutDate <= workout.workoutDate) : null;
    const comparison = previousSameTemplate ? workoutStats(previousSameTemplate) : null;
    return `<main class="page no-tabs">${pageHeader('Workout Complete', dateToLocalString(workout.workoutDate))}
      <section class="card accent"><h2>${escapeHtml(workout.name)}</h2><div class="metric-grid" style="margin-top:14px"><div class="metric"><div class="metric-value">${stats.exercises}</div><div class="metric-label">Exercises</div></div><div class="metric"><div class="metric-value">${stats.workingSets}</div><div class="metric-label">Working sets</div></div><div class="metric"><div class="metric-value">${stats.reps}</div><div class="metric-label">Repetitions</div></div><div class="metric"><div class="metric-value">${formatNumber(stats.volume)}</div><div class="metric-label">kg volume</div></div></div></section>
      ${records.length ? `<div class="section-title"><h2>Results</h2></div><div class="list">${records.map(r => `<div class="list-item"><span style="font-size:22px">${r.baseline ? '●' : '★'}</span><div class="grow"><div class="list-item-title">${escapeHtml(r.exercise)}</div><div class="list-item-sub">${escapeHtml(r.label)}</div></div></div>`).join('')}</div>` : ''}
      ${comparison ? `<section class="card"><h3>Compared with previous ${escapeHtml(getTemplate(workout.templateId)?.name || 'template')} workout</h3><p class="muted">${stats.volume === comparison.volume ? 'Same exercise volume' : `${formatNumber(Math.abs(stats.volume - comparison.volume))} kg ${stats.volume > comparison.volume ? 'more' : 'less'} volume`} · ${stats.workingSets - comparison.workingSets >= 0 ? '+' : ''}${stats.workingSets-comparison.workingSets} working sets</p></section>` : ''}
      ${workout.note ? `<section class="card"><h3>Workout note</h3><p class="pre-wrap">${escapeHtml(workout.note)}</p></section>` : ''}
      <div class="button-row"><button class="secondary-button" data-action="save-workout-template" data-id="${workout.id}">Save as Template</button>${workout.templateId ? `<button class="secondary-button" data-action="update-template-from-workout" data-id="${workout.id}">Update Template</button>` : ''}</div>
      <div class="sticky-actions"><button class="primary-button full-width" data-action="summary-home">Return Home</button></div>
    </main>`;
  }
  function renderProgress() {
    const recent = completedWorkouts().slice(0,4);
    const exerciseCount = data.exercises.filter(x => !x.isArchived).length;
    const totalWorkouts = completedWorkouts().length;
    const latest = completedWorkouts()[0];
    return `<main class="page">${pageHeader('Progress', 'History, records and consistency')}
      <div class="metric-grid"><div class="metric"><div class="metric-value">${totalWorkouts}</div><div class="metric-label">Workouts</div></div><div class="metric"><div class="metric-value">${exerciseCount}</div><div class="metric-label">Exercises</div></div><div class="metric"><div class="metric-value">${currentStreak()}</div><div class="metric-label">Week streak</div></div><div class="metric"><div class="metric-value">${latest ? formatNumber(workoutStats(latest).volume) : '0'}</div><div class="metric-label">Latest kg volume</div></div></div>
      <div class="section-title"><h2>Explore</h2></div>
      <div class="list">
        <button class="list-item" data-action="open-history"><span style="font-size:24px">📚</span><div class="grow"><div class="list-item-title">Workout History</div><div class="list-item-sub">Review and edit completed sessions</div></div>${ICONS.chevron}</button>
        <button class="list-item" data-action="choose-exercise-progress"><span style="font-size:24px">📈</span><div class="grow"><div class="list-item-title">Exercise Progress</div><div class="list-item-sub">Volume, weight, reps and records</div></div>${ICONS.chevron}</button>
        <button class="list-item" data-action="open-consistency"><span style="font-size:24px">🗓️</span><div class="grow"><div class="list-item-title">Consistency</div><div class="list-item-sub">Weekly goal, streak and heatmap</div></div>${ICONS.chevron}</button>
        <button class="list-item" data-action="open-bodyweight"><span style="font-size:24px">⚖️</span><div class="grow"><div class="list-item-title">Bodyweight</div><div class="list-item-sub">Entries and seven-day average</div></div>${ICONS.chevron}</button>
      </div>
      <div class="section-title"><h2>Recent workouts</h2><button class="link-button" data-action="open-history">See all</button></div>
      ${recent.length ? `<div class="list">${recent.map(renderWorkoutListCard).join('')}</div>` : `<div class="empty-state"><h3>No progress yet</h3><p>Complete a workout to begin building your history.</p></div>`}
    </main>`;
  }

  function renderHistory() {
    const query = currentScreen.params.query || '';
    const exerciseId = currentScreen.params.exerciseId || '';
    const workouts = completedWorkouts().filter(w => !exerciseId || w.exercises.some(x => x.exerciseId === exerciseId));
    const matches = w => !query || `${w.name} ${getTemplate(w.templateId)?.name || ''}`.toLowerCase().includes(query.toLowerCase());
    const visibleCount = workouts.filter(matches).length;
    return `<main class="page">${pageHeader('Workout History', `<span id="history-summary">${visibleCount} completed workout${visibleCount === 1 ? '' : 's'}</span>`, { back: true, subtitleHtml: true })}
      <div class="search-bar"><input class="search-input" placeholder="Search workouts" value="${escapeHtml(query)}" data-field="history-search"></div>
      <div class="field"><select class="select" data-field="history-exercise-filter"><option value="">All exercises</option>${data.exercises.filter(x => !x.isArchived).sort((a,b)=>a.name.localeCompare(b.name)).map(x => `<option value="${x.id}" ${exerciseId === x.id ? 'selected' : ''}>${escapeHtml(x.name)}</option>`).join('')}</select></div>
      <div id="history-list" class="list">${workouts.map(w => renderWorkoutListCard(w, true, !matches(w))).join('')}</div>
      <div id="history-empty" class="empty-state ${visibleCount ? 'hidden' : ''}"><h3>No matching workouts</h3><p>Try a different search or filter.</p></div>
    </main>`;
  }

  function renderWorkoutDetail(workoutId, editing = false) {
    const workout = getWorkout(workoutId);
    if (!workout || workout.status === 'deleted') return `<main class="page">${pageHeader('Workout unavailable', '', { back: true })}<div class="empty-state"><p>This workout is no longer available.</p></div></main>`;
    if (editing) return renderActiveWorkout(workout.id);
    const stats = workoutStats(workout);
    const records = getWorkoutRecords(workout).filter(x => !x.baseline);
    return `<main class="page">${pageHeader(workout.name, dateToLocalString(workout.workoutDate), { back: true, action: `<button class="icon-button" data-action="workout-detail-menu" data-id="${workout.id}" aria-label="Workout options">${ICONS.menu}</button>` })}
      <section class="card"><div class="metric-grid"><div class="metric"><div class="metric-value">${stats.exercises}</div><div class="metric-label">Exercises</div></div><div class="metric"><div class="metric-value">${stats.workingSets}</div><div class="metric-label">Working sets</div></div><div class="metric"><div class="metric-value">${stats.reps}</div><div class="metric-label">Reps</div></div><div class="metric"><div class="metric-value">${formatNumber(stats.volume)}</div><div class="metric-label">kg volume</div></div></div>${records.length ? `<div style="margin-top:12px"><span class="record-badge">★ ${records.length} personal record${records.length === 1 ? '' : 's'}</span></div>` : ''}</section>
      ${workout.note ? `<section class="card"><h3>Workout note</h3><p class="pre-wrap">${escapeHtml(workout.note)}</p></section>` : ''}
      ${workout.exercises.sort((a,b)=>a.position-b.position).map(we => {
        const ex = getExercise(we.exerciseId);
        const group = getGroup(ex?.muscleGroupId);
        return `<section class="card"><h2>${escapeHtml(ex?.name || 'Exercise')}</h2><p class="muted small">${escapeHtml(group?.name || '')}</p>${we.note ? `<p class="pre-wrap small">${escapeHtml(we.note)}</p>` : ''}<div class="list">${we.sets.sort((a,b)=>a.position-b.position).map((s,i) => `<div class="list-item"><span class="tag">${s.setType === 'warm_up' ? 'WU' : i+1}</span><div class="grow"><div class="list-item-title">${escapeHtml(formatSet(s))}</div><div class="list-item-sub">${s.isCompleted ? (s.setType === 'working' ? `${formatNumber(setVolume(s))} kg volume` : 'Warm-up') : 'Incomplete'}${s.rir != null ? ` · RIR ${s.rir}` : ''}${s.note ? ` · ${escapeHtml(s.note)}` : ''}</div></div>${s.isCompleted ? `<span class="status-pill success">Done</span>` : `<span class="status-pill">Incomplete</span>`}</div>`).join('')}</div></section>`;
      }).join('')}
      <div class="button-row"><button class="secondary-button" data-action="copy-workout" data-id="${workout.id}">Repeat Workout</button><button class="secondary-button" data-action="save-workout-template" data-id="${workout.id}">Save as Template</button></div>
    </main>`;
  }

  function filterByRange(items, dateKey, range) {
    if (range === 'all') return items;
    const months = { '1_month': 1, '3_months': 3, '6_months': 6, '1_year': 12 }[range] || 3;
    const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - months);
    const cutoffDate = localDateFromDate(cutoff);
    return items.filter(x => x[dateKey] >= cutoffDate);
  }

  function renderExerciseProgress(exerciseId, range) {
    const ex = getExercise(exerciseId);
    if (!ex) return `<main class="page">${pageHeader('Exercise Progress', '', { back: true })}<div class="empty-state"><h3>Choose an exercise</h3><button class="primary-button" data-action="choose-exercise-progress">Select Exercise</button></div></main>`;
    const sessions = completedWorkouts().map(w => ({ workout: w, stats: exerciseStatsInWorkout(w, exerciseId) })).filter(x => x.stats.sets > 0);
    const filtered = filterByRange(sessions.map(x => ({ ...x, date: x.workout.workoutDate })), 'date', range);
    const records = getRecordsForExercise(exerciseId);
    const bestReps = Object.entries(records.byReps).sort((a,b)=>Number(a[0])-Number(b[0]));
    return `<main class="page">${pageHeader(ex.name, 'Exercise progress', { back: true, action: `<button class="icon-button" data-action="choose-exercise-progress" aria-label="Choose exercise">${ICONS.menu}</button>` })}
      ${rangeSelector('exercise-range', range, { exerciseId })}
      <section class="card chart-card"><h3>Total working-set volume</h3>${filtered.length ? `<canvas id="exercise-volume-chart" aria-label="Exercise volume chart"></canvas><div class="chart-legend"><span><i class="legend-dot"></i> Volume in kg</span></div>` : `<div class="empty-state"><p>No completed working sets in this period.</p></div>`}</section>
      <div class="metric-grid"><div class="metric"><div class="metric-value">${records.heaviest ? `${formatNumber(records.heaviest.value)} kg` : '—'}</div><div class="metric-label">Heaviest weight</div></div><div class="metric"><div class="metric-value">${records.highestSet ? formatNumber(records.highestSet.value) : '—'}</div><div class="metric-label">Highest set volume</div></div><div class="metric"><div class="metric-value">${records.highestSession ? formatNumber(records.highestSession.value) : '—'}</div><div class="metric-label">Highest session volume</div></div><div class="metric"><div class="metric-value">${sessions.length}</div><div class="metric-label">Sessions</div></div></div>
      <div class="section-title"><h2>Best weight by reps</h2></div>
      ${bestReps.length ? `<div class="list">${bestReps.map(([reps, record]) => `<div class="list-item"><div class="grow"><div class="list-item-title">${reps} reps</div><div class="list-item-sub">${dateToLocalString(record.date)}</div></div><div class="metric-value" style="font-size:20px">${formatNumber(record.value)} kg</div></div>`).join('')}</div>` : `<p class="muted">No records yet.</p>`}
      <div class="section-title"><h2>Recent sessions</h2></div>
      ${filtered.length ? `<div class="list">${[...filtered].reverse().map(x => `<button class="list-item" data-action="open-workout-detail" data-id="${x.workout.id}"><div class="grow"><div class="list-item-title">${dateToLocalString(x.workout.workoutDate)}</div><div class="list-item-sub">${x.stats.sets} sets · ${x.stats.reps} reps · ${formatNumber(x.stats.volume)} kg volume</div></div>${ICONS.chevron}</button>`).join('')}</div>` : ''}
    </main>`;
  }

  function rangeSelector(field, selected, extra = {}) {
    const options = [['1_month','1M'],['3_months','3M'],['6_months','6M'],['1_year','1Y'],['all','All']];
    return `<div class="segmented" style="margin-bottom:14px">${options.map(([v,l]) => `<button class="${selected===v?'active':''}" data-action="change-range" data-field="${field}" data-value="${v}" ${Object.entries(extra).map(([k,val])=>`data-${k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())}="${val}"`).join(' ')}>${l}</button>`).join('')}</div>`;
  }

  function renderConsistency(monthOffset = 0) {
    const now = new Date(); now.setMonth(now.getMonth() + Number(monthOffset));
    const year = now.getFullYear(), month = now.getMonth();
    const first = new Date(year, month, 1), last = new Date(year, month + 1, 0);
    const startDay = data.settings.weekStartsOn === 'monday' ? (first.getDay()+6)%7 : first.getDay();
    const cells = [];
    for (let i=0;i<startDay;i++) cells.push(null);
    const volumesByDate = {};
    completedWorkouts().forEach(w => { volumesByDate[w.workoutDate] = (volumesByDate[w.workoutDate]||0)+workoutStats(w).volume; });
    const maxVol = Math.max(1, ...Object.values(volumesByDate));
    for (let day=1; day<=last.getDate(); day++) {
      const d = localDateFromDate(new Date(year, month, day));
      const vol = volumesByDate[d] || 0;
      const level = vol ? Math.max(1, Math.ceil(vol/maxVol*3)) : 0;
      cells.push({ date:d, day, level, volume:vol });
    }
    const week = startOfWeek(todayLocal());
    const days = workoutDaysForWeek(week).size;
    const weekTarget = targetForWeek(week);
    const labels = data.settings.weekStartsOn === 'monday' ? ['M','T','W','T','F','S','S'] : ['S','M','T','W','T','F','S'];
    return `<main class="page">${pageHeader('Consistency', 'Weekly goal and training calendar', { back: true })}
      <section class="card accent"><div class="metric-value">${days} of ${weekTarget}</div><div class="muted">workout days this week</div><div class="progress-bar" style="margin-top:14px"><span style="width:${Math.min(100, days/weekTarget*100)}%"></span></div><p class="strong">Current streak: ${currentStreak()} completed week${currentStreak()===1?'':'s'}</p><button class="secondary-button full-width" data-action="edit-week-target" style="margin-top:10px">Set this week's target</button></section>
      <section class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px"><button class="icon-button small" data-action="change-consistency-month" data-offset="${monthOffset-1}" aria-label="Previous month">${ICONS.back}</button><h3>${new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'}).format(now)}</h3><button class="icon-button small" data-action="change-consistency-month" data-offset="${monthOffset+1}" aria-label="Next month"><span style="transform:rotate(180deg);display:flex">${ICONS.back}</span></button></div><div class="heat-labels">${labels.map(x=>`<span>${x}</span>`).join('')}</div><div class="heatmap">${cells.map(c => c ? `<button class="heat-cell level-${c.level}" title="${c.date}: ${formatNumber(c.volume)} kg volume" data-action="heat-day" data-date="${c.date}"><span class="sr-only">${c.date}</span></button>` : '<span></span>').join('')}</div></section>
      <section class="card"><h3>Planned break</h3><p class="muted small">A planned-break week remains visible but does not break your streak.</p><button class="secondary-button full-width" data-action="manage-planned-break">Mark or edit this week</button></section>
    </main>`;
  }

  function renderBodyweight(range) {
    const entries = filterByRange(visibleBodyweights(), 'date', range);
    const latest = entries.at(-1);
    const all = visibleBodyweights();
    const first = all[0];
    const highest = all.length ? Math.max(...all.map(x=>Number(x.weightKg))) : null;
    const lowest = all.length ? Math.min(...all.map(x=>Number(x.weightKg))) : null;
    return `<main class="page">${pageHeader('Bodyweight', latest ? `${formatNumber(latest.weightKg)} kg latest` : 'No entries yet', { back: true, action: `<button class="icon-button" data-action="log-bodyweight" aria-label="Log bodyweight">${ICONS.plus}</button>` })}
      ${rangeSelector('bodyweight-range', range)}
      <section class="card chart-card"><h3>Weight and seven-day average</h3>${entries.length ? `<canvas id="bodyweight-chart" aria-label="Bodyweight chart"></canvas><div class="chart-legend"><span><i class="legend-dot"></i> Weight</span><span><i class="legend-dot" style="opacity:.45"></i> 7-day average</span></div>` : `<div class="empty-state"><h3>No bodyweight entries</h3><button class="primary-button" data-action="log-bodyweight">Log Bodyweight</button></div>`}</section>
      ${all.length ? `<div class="metric-grid"><div class="metric"><div class="metric-value">${formatNumber(latestBodyweight().weightKg)}</div><div class="metric-label">Latest kg</div></div><div class="metric"><div class="metric-value">${formatNumber(Number(latestBodyweight().weightKg)-Number(first.weightKg))}</div><div class="metric-label">Change from first kg</div></div><div class="metric"><div class="metric-value">${formatNumber(highest)}</div><div class="metric-label">Highest kg</div></div><div class="metric"><div class="metric-value">${formatNumber(lowest)}</div><div class="metric-label">Lowest kg</div></div></div>` : ''}
      <div class="section-title"><h2>Entries</h2></div>
      ${entries.length ? `<div class="list">${[...entries].reverse().map(x => `<button class="list-item" data-action="edit-bodyweight" data-id="${x.id}"><div class="grow"><div class="list-item-title">${formatNumber(x.weightKg)} kg</div><div class="list-item-sub">${dateToLocalString(x.date)}${x.note ? ` · ${escapeHtml(x.note)}` : ''}</div></div>${ICONS.chevron}</button>`).join('')}</div>` : ''}
    </main>`;
  }
  function renderMore() {
    return `<main class="page">${pageHeader('More', 'Exercises, templates and settings')}
      <div class="list">
        <button class="list-item" data-action="open-exercise-library"><span style="font-size:24px">🏋️</span><div class="grow"><div class="list-item-title">Exercise Library</div><div class="list-item-sub">${data.exercises.filter(x=>!x.isArchived).length} active exercises</div></div>${ICONS.chevron}</button>
        <button class="list-item" data-action="open-templates"><span style="font-size:24px">📝</span><div class="grow"><div class="list-item-title">Workout Templates</div><div class="list-item-sub">${visibleTemplates().length} active templates</div></div>${ICONS.chevron}</button>
        <button class="list-item" data-action="open-settings"><span style="font-size:24px">⚙️</span><div class="grow"><div class="list-item-title">Settings</div><div class="list-item-sub">Preferences and GitHub connection</div></div>${ICONS.chevron}</button>
        <button class="list-item" data-action="open-backup"><span style="font-size:24px">☁️</span><div class="grow"><div class="list-item-title">Backup and Restore</div><div class="list-item-sub">${statusInfo().label}</div></div>${ICONS.chevron}</button>
        <button class="list-item" data-action="open-deleted"><span style="font-size:24px">🗑️</span><div class="grow"><div class="list-item-title">Recently Deleted</div><div class="list-item-sub">Recover deleted workouts, templates and weigh-ins</div></div>${ICONS.chevron}</button>
      </div>
      <section class="card" style="margin-top:22px"><h3>Data revision</h3><p class="muted small">Local data revision ${data.dataRevision}. Last updated ${dateTimeString(data.updatedAt)}.</p>${statusPill()}</section>
    </main>`;
  }

  function renderExerciseLibrary(params) {
    const query = params.query || '';
    const groupId = params.groupId || '';
    const showArchived = Boolean(params.showArchived);
    const exercises = data.exercises.filter(x => (showArchived ? x.isArchived : !x.isArchived) && (!groupId || x.muscleGroupId === groupId)).sort((a,b)=>a.name.localeCompare(b.name));
    const matches = ex => !query || ex.name.toLowerCase().includes(query.toLowerCase());
    const visibleCount = exercises.filter(matches).length;
    return `<main class="page">${pageHeader('Exercise Library', `<span id="exercise-summary">${visibleCount} ${showArchived ? 'archived' : 'active'} exercise${visibleCount===1?'':'s'}</span>`, { back: true, subtitleHtml: true, action: `<button class="icon-button" data-action="new-exercise" aria-label="Add exercise">${ICONS.plus}</button>` })}
      <div class="search-bar"><input class="search-input" placeholder="Search exercises" value="${escapeHtml(query)}" data-field="exercise-search"></div>
      <div class="chips"><button class="chip-button ${!groupId?'active':''}" data-action="filter-exercise-group" data-id="">All</button>${data.muscleGroups.sort((a,b)=>a.position-b.position).map(g=>`<button class="chip-button ${groupId===g.id?'active':''}" data-action="filter-exercise-group" data-id="${g.id}">${escapeHtml(g.name)}</button>`).join('')}</div>
      <label class="toggle-row"><span><strong>Show archived</strong></span><span class="switch"><input type="checkbox" data-field="show-archived-exercises" ${showArchived?'checked':''}><span></span></span></label>
      <div id="exercise-library-list" class="list">${exercises.map(ex => `<button class="list-item ${matches(ex)?'':'hidden'}" data-exercise-item data-search-text="${escapeHtml(ex.name.toLowerCase())}" data-action="edit-exercise" data-id="${ex.id}"><div class="grow"><div class="list-item-title">${escapeHtml(ex.name)}</div><div class="list-item-sub">${escapeHtml(getGroup(ex.muscleGroupId)?.name || 'Other')}${ex.isArchived?' · Archived':''}</div></div>${ICONS.chevron}</button>`).join('')}</div>
      <div id="exercise-library-empty" class="empty-state ${visibleCount?'hidden':''}"><h3>No exercises found</h3><p>Add an exercise or adjust your filters.</p><button class="primary-button" data-action="new-exercise">Add Exercise</button></div>
      <div class="section-title"><h2>Muscle groups</h2><button class="link-button" data-action="manage-groups">Manage</button></div>
    </main>`;
  }

  function renderTemplates() {
    const active = visibleTemplates().sort((a,b)=>Number(b.isFavourite)-Number(a.isFavourite) || a.name.localeCompare(b.name));
    const archived = data.templates.filter(x=>x.isArchived && !x.deletedAt);
    return `<main class="page">${pageHeader('Templates', `${active.length} active`, { back: true, action: `<button class="icon-button" data-action="new-template" aria-label="Add template">${ICONS.plus}</button>` })}
      ${active.length ? `<div class="list">${active.map(t=>`<button class="list-item" data-action="edit-template" data-id="${t.id}"><span style="font-size:21px">${t.isFavourite?'★':'○'}</span><div class="grow"><div class="list-item-title">${escapeHtml(t.name)}</div><div class="list-item-sub">${t.exercises.length} exercises</div></div>${ICONS.chevron}</button>`).join('')}</div>` : `<div class="empty-state"><h3>No templates yet</h3><p>Create one now, or save a completed workout as a template.</p><button class="primary-button" data-action="new-template">Create Template</button></div>`}
      ${archived.length ? `<div class="section-title"><h2>Archived</h2></div><div class="list">${archived.map(t=>`<button class="list-item" data-action="edit-template" data-id="${t.id}"><div class="grow"><div class="list-item-title">${escapeHtml(t.name)}</div><div class="list-item-sub">Archived</div></div>${ICONS.chevron}</button>`).join('')}</div>`:''}
    </main>`;
  }

  function renderTemplateEditor(templateId) {
    const template = templateId ? getTemplate(templateId) : null;
    if (!templateDraft || templateDraft.sourceId !== (templateId || null)) {
      templateDraft = template ? { ...deepClone(template), sourceId: template.id } : { id:'', sourceId:null, name:'', isFavourite:false, isArchived:false, exercises:[], deletedAt:null };
    }
    const draft = templateDraft;
    return `<main class="page">${pageHeader(template ? 'Edit Template' : 'New Template', 'Changes save when you tap Save', { back: true })}
      <div class="field"><label for="template-name">Template name</label><input class="input" id="template-name" value="${escapeHtml(draft.name)}" placeholder="e.g. Push Day"></div>
      <label class="toggle-row"><span><strong>Favourite</strong><br><span class="small muted">Show it prominently on Home.</span></span><span class="switch"><input id="template-favourite" type="checkbox" ${draft.isFavourite?'checked':''}><span></span></span></label>
      <div class="section-title"><h2>Exercises</h2><button class="link-button" data-action="add-exercise-to-template" data-id="${templateId || ''}">Add</button></div>
      <div id="template-exercise-list">${draft.exercises.length ? draft.exercises.sort((a,b)=>a.position-b.position).map((te,i)=>{
        const ex=getExercise(te.exerciseId); return `<section class="card" data-template-exercise="${te.id}"><div style="display:flex;gap:8px;align-items:center"><div class="grow"><h3>${escapeHtml(ex?.name||'Exercise')}</h3><p class="muted small">${escapeHtml(getGroup(ex?.muscleGroupId)?.name||'')}</p></div><div class="drag-buttons"><button data-action="move-template-exercise" data-direction="up" data-te-id="${te.id}" ${i===0?'disabled':''} aria-label="Move template exercise up">↑</button><button data-action="move-template-exercise" data-direction="down" data-te-id="${te.id}" ${i===draft.exercises.length-1?'disabled':''} aria-label="Move template exercise down">↓</button></div><button class="icon-button small" data-action="remove-template-exercise" data-template-id="${templateId||''}" data-te-id="${te.id}" aria-label="Remove exercise from template">${ICONS.trash}</button></div><div class="input-row"><div class="field"><label>Working sets</label><input class="input template-field" type="number" min="1" max="20" value="${te.targetWorkingSets||3}" data-key="targetWorkingSets" data-te-id="${te.id}"></div><div class="field"><label>Suggested kg</label><input class="input template-field" type="number" min="0" max="1000" step="0.25" value="${te.suggestedWeightKg??''}" data-key="suggestedWeightKg" data-te-id="${te.id}"></div></div><div class="input-row"><div class="field"><label>Rep minimum</label><input class="input template-field" type="number" min="1" max="1000" value="${te.targetRepMin??''}" data-key="targetRepMin" data-te-id="${te.id}"></div><div class="field"><label>Rep maximum</label><input class="input template-field" type="number" min="1" max="1000" value="${te.targetRepMax??''}" data-key="targetRepMax" data-te-id="${te.id}"></div></div><div class="field"><label>Warm-up guidance</label><input class="input template-field" value="${escapeHtml(te.warmUpGuidance||'')}" data-key="warmUpGuidance" data-te-id="${te.id}"></div><div class="field"><label>Exercise note</label><input class="input template-field" value="${escapeHtml(te.note||'')}" data-key="note" data-te-id="${te.id}"></div></section>`;
      }).join('') : `<div class="empty-state"><h3>No exercises</h3><p>Add exercises to this template.</p></div>`}</div>
      <div class="sticky-actions"><button class="primary-button full-width" data-action="save-template-editor" data-id="${templateId || ''}">Save Template</button></div>
      ${template ? `<div class="button-row"><button class="secondary-button" data-action="duplicate-template" data-id="${template.id}">Duplicate</button><button class="secondary-button" data-action="toggle-archive-template" data-id="${template.id}">${template.isArchived?'Restore':'Archive'}</button><button class="danger-button" data-action="delete-template" data-id="${template.id}">Delete</button></div>`:''}
    </main>`;
  }

  function renderSettings() {
    const s = data.settings, gh=config.github;
    return `<main class="page">${pageHeader('Settings', '', { back: true })}
      <div class="section-title"><h2>Workout</h2></div><section class="card">
        <div class="field"><label>Weekly workout target</label><input class="input" type="number" min="1" max="7" value="${s.weeklyTarget}" data-field="setting-weekly-target"></div>
        <div class="field"><label>First day of week</label><select class="select" data-field="setting-week-start"><option value="monday" ${s.weekStartsOn==='monday'?'selected':''}>Monday</option><option value="sunday" ${s.weekStartsOn==='sunday'?'selected':''}>Sunday</option></select></div>
        <label class="toggle-row"><span><strong>Show RIR field</strong></span><span class="switch"><input type="checkbox" data-field="setting-show-rir" ${s.showRir?'checked':''}><span></span></span></label>
        <div class="field" style="margin-top:14px"><label>Default set type</label><select class="select" data-field="setting-set-type"><option value="working" ${s.defaultSetType==='working'?'selected':''}>Working</option><option value="warm_up" ${s.defaultSetType==='warm_up'?'selected':''}>Warm-up</option></select></div>
      </section>
      <div class="section-title"><h2>Display</h2></div><section class="card"><div class="field"><label>Appearance</label><select class="select" data-field="setting-appearance"><option value="system" ${s.appearance==='system'?'selected':''}>Follow iPhone</option><option value="light" ${s.appearance==='light'?'selected':''}>Light</option><option value="dark" ${s.appearance==='dark'?'selected':''}>Dark</option></select></div><div class="field"><label>Set row spacing</label><select class="select" data-field="setting-density"><option value="comfortable" ${s.setRowDensity==='comfortable'?'selected':''}>Comfortable</option><option value="compact" ${s.setRowDensity==='compact'?'selected':''}>Compact</option></select></div><div class="field"><label>Default chart range</label><select class="select" data-field="setting-chart-range"><option value="1_month" ${s.defaultChartRange==='1_month'?'selected':''}>1 month</option><option value="3_months" ${s.defaultChartRange==='3_months'?'selected':''}>3 months</option><option value="6_months" ${s.defaultChartRange==='6_months'?'selected':''}>6 months</option><option value="1_year" ${s.defaultChartRange==='1_year'?'selected':''}>1 year</option><option value="all" ${s.defaultChartRange==='all'?'selected':''}>All time</option></select></div></section>
      <div class="section-title"><h2>GitHub</h2></div><section class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><strong>${gh.connected ? `${escapeHtml(gh.username)}/${escapeHtml(gh.repo)}` : 'Not connected'}</strong><div class="muted small">${gh.connected ? `${escapeHtml(gh.branch)} · ${escapeHtml(gh.path)}` : 'Workout data is currently local only.'}</div></div>${statusPill()}</div><p class="small muted">Last backup: ${dateTimeString(gh.lastSyncedAt)}</p><div class="button-row">${gh.connected ? `<button class="secondary-button" data-action="sync-now">Back up now</button><button class="secondary-button" data-action="open-github-setup">Reconnect</button><button class="danger-button" data-action="disconnect-github">Disconnect</button>` : `<button class="primary-button" data-action="open-github-setup">Connect GitHub</button>`}</div></section>
    </main>`;
  }

  function renderBackup() {
    const gh=config.github;
    return `<main class="page">${pageHeader('Backup and Restore', '', { back:true })}
      <section class="card"><h2>${statusInfo().label}</h2><p class="muted">Local revision ${data.dataRevision}. ${gh.connected ? `GitHub revision ${gh.lastRevision ?? 'not yet backed up'}.` : 'GitHub is not connected.'}</p><p class="small muted">Last successful backup: ${dateTimeString(gh.lastSyncedAt)}</p>${gh.errorMessage?`<div class="card danger flat"><strong>Backup error</strong><p class="small">${escapeHtml(gh.errorMessage)}</p></div>`:''}<div class="button-row">${gh.connected?`<button class="primary-button" data-action="sync-now">Back up now</button><button class="secondary-button" data-action="open-github-setup">Connection settings</button>`:`<button class="primary-button" data-action="open-github-setup">Connect GitHub</button>`}</div></section>
      <div class="section-title"><h2>Manual copies</h2></div><div class="list"><button class="list-item" data-action="download-json">${ICONS.download}<div class="grow"><div class="list-item-title">Download complete JSON backup</div><div class="list-item-sub">A restorable copy of all workout data</div></div></button><button class="list-item" data-action="download-csv">${ICONS.download}<div class="grow"><div class="list-item-title">Export workout history as CSV</div><div class="list-item-sub">One row per set segment</div></div></button><button class="list-item" data-action="restore-json">${ICONS.upload}<div class="grow"><div class="list-item-title">Restore from JSON backup</div><div class="list-item-sub">The current data is downloaded first</div></div></button></div>
    </main>`;
  }

  function renderRecentlyDeleted() {
    const workouts=data.workouts.filter(x=>x.status==='deleted');
    const templates=data.templates.filter(x=>x.deletedAt);
    const weights=data.bodyweightEntries.filter(x=>x.deletedAt);
    const items=[...workouts.map(x=>({type:'workout',id:x.id,title:x.name,sub:`Workout · deleted ${dateToLocalString(x.deletedAt)}`})),...templates.map(x=>({type:'template',id:x.id,title:x.name,sub:`Template · deleted ${dateToLocalString(x.deletedAt)}`})),...weights.map(x=>({type:'bodyweight',id:x.id,title:`${formatNumber(x.weightKg)} kg`,sub:`Bodyweight · ${dateToLocalString(x.date)}`}))];
    return `<main class="page">${pageHeader('Recently Deleted', 'Items are kept for at least 30 days and removed after a successful backup', {back:true})}${items.length?`<div class="list">${items.map(x=>`<div class="list-item"><div class="grow"><div class="list-item-title">${escapeHtml(x.title)}</div><div class="list-item-sub">${escapeHtml(x.sub)}</div></div><button class="mini-button" data-action="restore-deleted" data-type="${x.type}" data-id="${x.id}">Restore</button><button class="mini-button danger" data-action="permanent-delete" data-type="${x.type}" data-id="${x.id}">Delete</button></div>`).join('')}</div>`:`<div class="empty-state"><div class="empty-icon">✓</div><h3>Nothing deleted</h3><p>Recoverable items will appear here.</p></div>`}</main>`;
  }

  function renderConflict() {
    const c=config.conflict;
    if(!c) { setTimeout(()=>switchTab('home'),0); return ''; }
    return `<main class="setup-wrap"><section class="setup-card"><div class="app-mark">!</div><h1>Two backup versions found</h1><p class="muted">The phone and GitHub both changed. Nothing has been overwritten. Download either copy, then choose which one should continue.</p><div class="input-row"><div class="card flat"><strong>Phone copy</strong><p class="small muted">Revision ${c.localData.dataRevision}<br>${dateTimeString(c.localData.updatedAt)}</p><button class="secondary-button full-width" data-action="download-conflict" data-side="local">Download</button></div><div class="card flat"><strong>GitHub copy</strong><p class="small muted">Revision ${c.remoteData.dataRevision}<br>${dateTimeString(c.remoteData.updatedAt)}</p><button class="secondary-button full-width" data-action="download-conflict" data-side="remote">Download</button></div></div><div class="button-row"><button class="secondary-button" data-action="resolve-conflict" data-choice="remote">Use GitHub copy</button><button class="primary-button" data-action="resolve-conflict" data-choice="local">Use phone copy</button></div></section></main>`;
  }

  function renderModal() {
    if (!modal) return '';
    const body = renderModalBody(modal.type, modal.params);
    return `<div class="modal-backdrop" data-action="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-handle"></div>${body}</section></div>`;
  }

  function renderModalBody(type, p) {
    if (type === 'startWorkoutMeta') {
      return `<div class="modal-header"><h2>Start Workout</h2><button class="icon-button small" data-action="close-modal" aria-label="Close">${ICONS.close}</button></div><div class="field"><label>Workout name</label><input class="input" id="start-workout-name" value="${escapeHtml(p.defaultName || 'Workout')}"></div><div class="field"><label>Workout date</label><input class="input" id="start-workout-date" type="date" value="${p.date || todayLocal()}"></div><button class="primary-button full-width" data-action="confirm-start-workout">Start Workout</button>`;
    }
    if (type === 'exercisePicker') {
      const selected = new Set(p.selectedIds || []);
      const exercises = data.exercises.filter(x=>!x.isArchived && !selected.has(x.id)).sort((a,b)=>a.name.localeCompare(b.name));
      return `<div class="modal-header"><h2>Add Exercise</h2><button class="icon-button small" data-action="close-modal" aria-label="Close">${ICONS.close}</button></div><div class="search-bar"><input class="search-input" placeholder="Search exercises" data-field="picker-search"></div><div id="picker-list" class="list">${exercises.map(ex=>`<button class="list-item picker-item" data-name="${escapeHtml(ex.name.toLowerCase())}" data-action="pick-exercise" data-id="${ex.id}" data-context="${escapeHtml(p.context)}" data-parent-id="${escapeHtml(p.parentId||'')}"><div class="grow"><div class="list-item-title">${escapeHtml(ex.name)}</div><div class="list-item-sub">${escapeHtml(getGroup(ex.muscleGroupId)?.name||'Other')}</div></div>${ICONS.plus}</button>`).join('')}</div><button class="secondary-button full-width" data-action="new-exercise" data-return-context="${escapeHtml(p.context)}" data-parent-id="${escapeHtml(p.parentId||'')}">Create New Exercise</button>`;
    }
    if (type === 'exerciseEditor') {
      const ex=p.exerciseId?getExercise(p.exerciseId):null;
      return `<div class="modal-header"><h2>${ex?'Edit':'New'} Exercise</h2><button class="icon-button small" data-action="close-modal" aria-label="Close">${ICONS.close}</button></div><div class="field"><label>Name</label><input class="input" id="exercise-name" value="${escapeHtml(ex?.name||'')}"></div><div class="field"><label>Muscle group</label><select class="select" id="exercise-group">${data.muscleGroups.sort((a,b)=>a.position-b.position).map(g=>`<option value="${g.id}" ${ex?.muscleGroupId===g.id?'selected':''}>${escapeHtml(g.name)}</option>`).join('')}</select></div><div class="field"><label>Permanent note</label><textarea class="textarea" id="exercise-note">${escapeHtml(ex?.permanentNote||'')}</textarea></div><button class="primary-button full-width" data-action="save-exercise" data-id="${ex?.id||''}" data-return-context="${escapeHtml(p.returnContext||'')}" data-parent-id="${escapeHtml(p.parentId||'')}">Save Exercise</button>${ex?`<button class="secondary-button full-width" style="margin-top:8px" data-action="toggle-archive-exercise" data-id="${ex.id}">${ex.isArchived?'Restore':'Archive'} Exercise</button>`:''}`;
    }
    if (type === 'bodyweightEditor') {
      const existing=p.id?data.bodyweightEntries.find(x=>x.id===p.id):data.bodyweightEntries.find(x=>x.date===(p.date||todayLocal())&&!x.deletedAt);
      return `<div class="modal-header"><h2>${existing?'Edit':'Log'} Bodyweight</h2><button class="icon-button small" data-action="close-modal" aria-label="Close">${ICONS.close}</button></div><div class="field"><label>Date</label><input class="input" id="bodyweight-date" type="date" value="${existing?.date||p.date||todayLocal()}"></div><div class="field"><label>Weight in kilograms</label><input class="input" id="bodyweight-value" type="number" inputmode="decimal" min="20" max="500" step="0.1" value="${existing?.weightKg??''}"></div><div class="field"><label>Note</label><textarea class="textarea" id="bodyweight-note">${escapeHtml(existing?.note||'')}</textarea></div><button class="primary-button full-width" data-action="save-bodyweight" data-id="${existing?.id||''}">Save</button>${existing?`<button class="danger-button full-width" style="margin-top:8px" data-action="delete-bodyweight" data-id="${existing.id}">Delete</button>`:''}`;
    }
    if (type === 'workoutMenu') {
      const w=getWorkout(p.workoutId); return `<div class="modal-header"><h2>Workout Options</h2><button class="icon-button small" data-action="close-modal" aria-label="Close">${ICONS.close}</button></div>${w.status==='completed'?`<button class="list-item" data-action="edit-completed-workout" data-id="${w.id}">${ICONS.workout}<div class="grow"><div class="list-item-title">Edit sets and exercises</div></div></button>`:''}<button class="list-item" data-action="edit-workout-meta" data-id="${w.id}">${ICONS.edit}<div class="grow"><div class="list-item-title">Edit name, date and note</div></div></button><button class="list-item" data-action="move-workout-deleted" data-id="${w.id}">${ICONS.trash}<div class="grow"><div class="list-item-title">Move to Recently Deleted</div></div></button>`;
    }
    if (type === 'workoutMeta') {
      const w=getWorkout(p.workoutId); return `<div class="modal-header"><h2>Edit Workout</h2><button class="icon-button small" data-action="close-modal" aria-label="Close">${ICONS.close}</button></div><div class="field"><label>Name</label><input class="input" id="workout-name" value="${escapeHtml(w.name)}"></div><div class="field"><label>Date</label><input class="input" id="workout-date" type="date" value="${w.workoutDate}"></div><div class="field"><label>Workout note</label><textarea class="textarea" id="workout-note">${escapeHtml(w.note||'')}</textarea></div><button class="primary-button full-width" data-action="save-workout-meta" data-id="${w.id}">Save</button>`;
    }
    if (type === 'exerciseCardMenu') {
      const w=getWorkout(p.workoutId),we=w.exercises.find(x=>x.id===p.weId); return `<div class="modal-header"><h2>Exercise Options</h2><button class="icon-button small" data-action="close-modal" aria-label="Close">${ICONS.close}</button></div><button class="list-item" data-action="edit-workout-exercise-note" data-workout-id="${w.id}" data-we-id="${we.id}">${ICONS.edit}<div class="grow"><div class="list-item-title">Exercise note</div></div></button><button class="list-item" data-action="change-workout-exercise" data-workout-id="${w.id}" data-we-id="${we.id}">${ICONS.workout}<div class="grow"><div class="list-item-title">Change exercise</div></div></button><button class="list-item" data-action="remove-workout-exercise" data-workout-id="${w.id}" data-we-id="${we.id}">${ICONS.trash}<div class="grow"><div class="list-item-title">Remove from workout</div></div></button>`;
    }
    if (type === 'textEditor') {
      return `<div class="modal-header"><h2>${escapeHtml(p.title)}</h2><button class="icon-button small" data-action="close-modal" aria-label="Close">${ICONS.close}</button></div><div class="field"><textarea class="textarea" id="text-editor-value">${escapeHtml(p.value||'')}</textarea></div><button class="primary-button full-width" data-action="save-text-editor">Save</button>`;
    }
    if (type === 'previousSessions') {
