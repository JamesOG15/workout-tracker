  function makeSegment(weight = '', reps = '', position = 0) {
    return { id: uuid(), position, weightKg: weight, reps };
  }
  function makeSet(position, source = null, suggestedWeight = null) {
    const seg = source?.segments?.[0];
    return {
      id: uuid(), position,
      setType: source?.setType || data.settings.defaultSetType,
      isCompleted: false,
      rir: null,
      note: null,
      segments: [makeSegment(seg?.weightKg ?? suggestedWeight ?? '', seg?.reps ?? '', 0)],
      createdAt: nowIso(), updatedAt: nowIso()
    };
  }
  function findWorkoutExercise(workoutId, weId) { return getWorkout(workoutId)?.exercises.find(x=>x.id===weId); }
  function findSet(workoutId, weId, setId) { return findWorkoutExercise(workoutId,weId)?.sets.find(x=>x.id===setId); }
  function normalisePositions(items) { items.forEach((x,i)=>x.position=i); }

  function prepareStart(kind, id = null) {
    const active=getActiveWorkout();
    if(active){ showToast('A workout is already in progress. Resume or finish it first.'); navigate('activeWorkout',{workoutId:active.id}); return; }
    let defaultName='Workout';
    if(kind==='template') defaultName=getTemplate(id)?.name||'Workout';
    if(kind==='copy') defaultName=getWorkout(id)?.name||'Workout';
    pendingStart={kind,id};
    openModal('startWorkoutMeta',{defaultName,date:todayLocal()});
  }

  async function confirmStartWorkout() {
    const name=(document.getElementById('start-workout-name')?.value||'Workout').trim()||'Workout';
    const workoutDate=document.getElementById('start-workout-date')?.value||todayLocal();
    const source=pendingStart;
    if(!source) return;
    const ts=nowIso();
    let templateId=null, exercises=[];
    if(source.kind==='template'){
      const t=getTemplate(source.id); templateId=t?.id||null;
      exercises=(t?.exercises||[]).sort((a,b)=>a.position-b.position).map((te,pos)=>({
        id:uuid(), exerciseId:te.exerciseId, position:pos, note:te.note||null,
        targetRepMin:te.targetRepMin??null, targetRepMax:te.targetRepMax??null, warmUpGuidance:te.warmUpGuidance||null,
        sets:Array.from({length:Math.max(1,Number(te.targetWorkingSets||1))},(_,i)=>{const set=makeSet(i,null,te.suggestedWeightKg);if(te.targetRepMin&&te.targetRepMax&&Number(te.targetRepMin)===Number(te.targetRepMax))set.segments[0].reps=Number(te.targetRepMin);return set;}),
      }));
    } else if(source.kind==='copy'){
      const w=getWorkout(source.id); templateId=w?.templateId||null;
      exercises=(w?.exercises||[]).sort((a,b)=>a.position-b.position).map((we,pos)=>({
        id:uuid(), exerciseId:we.exerciseId, position:pos, note:we.note||null,
        targetRepMin:we.targetRepMin??null, targetRepMax:we.targetRepMax??null, warmUpGuidance:we.warmUpGuidance||null,
        sets:we.sets.map((s,i)=>({ ...makeSet(i,s), setType:s.setType, segments:s.segments.map((seg,si)=>makeSegment(seg.weightKg,seg.reps,si)) }))
      }));
    }
    const workout={id:uuid(),name,workoutDate,status:'in_progress',templateId,note:null,exercises,createdAt:ts,updatedAt:ts,completedAt:null,deletedAt:null};
    await commitData(d=>d.workouts.push(workout));
    pendingStart=null; closeModal();
    currentTab='workout'; screenStack=[]; currentScreen={name:'activeWorkout',params:{workoutId:workout.id}}; render();
  }

  async function addExerciseToWorkout(workoutId, exerciseId) {
    await commitData(d=>{
      const w=d.workouts.find(x=>x.id===workoutId); if(!w) return;
      if(w.exercises.some(x=>x.exerciseId===exerciseId)){ throw new Error('This exercise is already in the workout.'); }
      w.exercises.push({id:uuid(),exerciseId,position:w.exercises.length,note:null,targetRepMin:null,targetRepMax:null,warmUpGuidance:null,sets:[]}); w.updatedAt=nowIso();
    });
  }

  async function addSet(workoutId,weId) {
    await commitData(d=>{
      const w=d.workouts.find(x=>x.id===workoutId); const we=w?.exercises.find(x=>x.id===weId); if(!we)return;
      const prevCurrent=we.sets.at(-1);
      const prevWorkout=getPreviousWorkoutsForExercise(we.exerciseId,w,1)[0];
      const previousMatching=prevWorkout?.exercises.find(x=>x.exerciseId===we.exerciseId)?.sets?.[we.sets.length];
      const source=prevCurrent?.segments?.some(s=>s.weightKg!==''||s.reps!=='')?prevCurrent:previousMatching;
      we.sets.push(makeSet(we.sets.length,source)); w.updatedAt=nowIso();
    });
  }

  async function toggleSetComplete(workoutId,weId,setId) {
    const set=findSet(workoutId,weId,setId); if(!set)return;
    if(!set.isCompleted){
      const invalid=set.segments.some(s=>s.weightKg===''||s.weightKg===null||!Number.isFinite(Number(s.weightKg))||!Number.isInteger(Number(s.reps))||Number(s.reps)<1);
      if(invalid){ showToast('Enter a valid weight and repetitions for every segment first.'); return; }
    }
    const we=findWorkoutExercise(workoutId,weId);
    const historical=getRecordsForExercise(we.exerciseId,workoutId);
    const previouslyCompleted=we.sets.filter(s=>s.id!==setId&&s.isCompleted&&s.setType==='working');
    const previousHeaviest=Math.max(historical.heaviest?.value||0,...previouslyCompleted.flatMap(s=>s.segments.map(seg=>Number(seg.weightKg)||0)));
    const previousSetVolume=Math.max(historical.highestSet?.value||0,...previouslyCompleted.map(setVolume));
    const previousByReps={};
    Object.entries(historical.byReps).forEach(([reps,r])=>previousByReps[reps]=r.value);
    previouslyCompleted.flatMap(s=>s.segments).forEach(seg=>{const reps=Number(seg.reps),weight=Number(seg.weightKg);previousByReps[reps]=Math.max(previousByReps[reps]||0,weight);});
    await commitData(d=>{const s=findSet(workoutId,weId,setId);s.isCompleted=!s.isCompleted;s.updatedAt=nowIso();const ww=d.workouts.find(x=>x.id===workoutId);ww.updatedAt=nowIso();});
    const updated=findSet(workoutId,weId,setId);
    if(updated.isCompleted&&updated.setType==='working'&&historical.heaviest){
      const newLabels=[];
      const maxW=Math.max(...updated.segments.map(s=>Number(s.weightKg)));
      if(maxW>previousHeaviest)newLabels.push('new heaviest weight');
      if(setVolume(updated)>previousSetVolume)newLabels.push('new set-volume record');
      updated.segments.forEach(seg=>{if(Number(seg.weightKg)>(previousByReps[Number(seg.reps)]||0))newLabels.push(`best ${seg.reps}-rep weight`);});
      if(newLabels.length) showToast(`★ ${newLabels[0]}`);
    }
  }

  async function completeWorkout(workoutId, removeIncomplete) {
    const existing=getWorkout(workoutId);
    if(!existing?.exercises.some(we=>we.sets.some(s=>s.isCompleted))){showToast('Complete at least one set before finishing the workout.');return;}
    await commitData(d=>{
      const w=d.workouts.find(x=>x.id===workoutId);if(!w)return;
      if(removeIncomplete) w.exercises.forEach(we=>{we.sets=we.sets.filter(s=>s.isCompleted);normalisePositions(we.sets);});
      w.status='completed';w.completedAt=nowIso();w.updatedAt=nowIso();
      const week=startOfWeek(w.workoutDate,d.settings.weekStartsOn);
      d.weeklyTargets ||= [];
      if(!d.weeklyTargets.some(x=>x.weekStartDate===week))d.weeklyTargets.push({id:`weekly-${week}`,weekStartDate:week,target:Number(d.settings.weeklyTarget||3),kind:'snapshot',createdAt:nowIso(),updatedAt:nowIso()});
    });
    lastSummaryWorkoutId=workoutId;
    navigate('workoutSummary',{workoutId},false);
    syncNow('workout-completed');
  }

  function githubHeaders(token=config.github.token){return{'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};}
  function githubPathUrl(username,repo,path){return `${GITHUB_API}/repos/${encodeURIComponent(username)}/${encodeURIComponent(repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;}
  async function githubFetch(url,options={}){
    const res=await fetch(url,{...options,headers:{...githubHeaders(),...(options.headers||{})}});
    let body=null;try{body=await res.json();}catch{}
    if(!res.ok){const err=new Error(body?.message||`GitHub returned ${res.status}`);err.status=res.status;err.body=body;throw err;}
    return body;
  }
  function textToBase64(text){const bytes=new TextEncoder().encode(text);let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));return btoa(binary);}
  function base64ToText(value){const binary=atob(value.replace(/\n/g,''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes);}
  async function contentHash(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));const digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');}
  async function fetchGithubData(){
    const gh=config.github;const url=githubPathUrl(gh.username,gh.repo,gh.path)+`?ref=${encodeURIComponent(gh.branch)}`;
    try{const file=await githubFetch(url);const parsed=JSON.parse(base64ToText(file.content));return{exists:true,sha:file.sha,data:parsed,hash:await contentHash(parsed)};}catch(error){if(error.status===404)return{exists:false,sha:null,data:null,hash:null};throw error;}
  }
  async function putGithubData(remoteSha=null,overrideData=data){
    const gh=config.github;const url=githubPathUrl(gh.username,gh.repo,gh.path);const payload={message:`Workout data backup - ${new Date().toISOString().replace('T',' ').slice(0,16)} UTC`,content:textToBase64(JSON.stringify(overrideData,null,2)),branch:gh.branch};if(remoteSha)payload.sha=remoteSha;
    return githubFetch(url,{method:'PUT',body:JSON.stringify(payload)});
  }

  async function connectGithubFromForm(){
    const username=document.getElementById('gh-user').value.trim();const repo=document.getElementById('gh-repo').value.trim();const token=document.getElementById('gh-token').value.trim();
    if(!username||!repo||!token){showToast('Enter your username, repository and token.');return;}
    const old=deepClone(config.github);Object.assign(config.github,{username,repo,token,branch:'main',path:'data/workout-data.json',connected:false,errorType:null,errorMessage:null});await saveConfig();
    try{
      await githubFetch(`${GITHUB_API}/repos/${encodeURIComponent(username)}/${encodeURIComponent(repo)}`);
      const remote=await fetchGithubData();
      if(remote.exists){
        normaliseLoadedData(remote.data);ensureHistoricalWeekTargets(remote.data);remote.hash=await contentHash(remote.data);
        const check=validateData(remote.data);if(!check.valid)throw new Error(`GitHub data file is invalid: ${check.errors.join(' ')}`);
        const localHash=await contentHash(data);
        if(!hasMeaningfulData()&&hasMeaningfulData(remote.data)){
          pendingGithubRestore={oldGithub:old,remoteData:deepClone(remote.data),remoteSha:remote.sha,remoteHash:remote.hash,localData:deepClone(data)};
          currentScreen={name:'githubRestore',params:{}};render();return;
        }
        if(hasMeaningfulData()&&hasMeaningfulData(remote.data)&&localHash!==remote.hash){
          config.conflict={localData:deepClone(data),remoteData:deepClone(remote.data),remoteSha:remote.sha,createdAt:nowIso()};config.github.connected=true;config.github.lastSha=old.lastSha;await saveConfig();currentScreen={name:'conflict',params:{}};render();return;
        }
        config.github.lastSha=remote.sha;config.github.lastRevision=remote.data.dataRevision;config.github.lastHash=remote.hash;config.github.lastSyncedAt=nowIso();
      }else{
        const result=await putGithubData(null,data);config.github.lastSha=result.content.sha;config.github.lastRevision=data.dataRevision;config.github.lastHash=await contentHash(data);config.github.lastSyncedAt=nowIso();
      }
      Object.assign(config.github,{connected:true,pending:false,pendingChanges:0,retryCount:0,errorType:null,errorMessage:null});config.setupComplete=true;await saveConfig();showToast('GitHub connected and backup confirmed.');switchTab('home');
    }catch(error){config.github=old;await saveConfig();showToast(`GitHub connection failed: ${error.message}`,null,null,7000);}
  }

  async function handleGithubRestoreChoice(choice){
    const pending=pendingGithubRestore;if(!pending)return;
    if(choice==='cancel'){
      config.github=pending.oldGithub;pendingGithubRestore=null;await saveConfig();currentScreen={name:'githubSetup',params:{}};render();showToast('GitHub connection cancelled.');return;
    }
    try{
      if(choice==='restore'){
        data=normaliseLoadedData(deepClone(pending.remoteData));ensureHistoricalWeekTargets(data);await saveDataRaw();
        Object.assign(config.github,{connected:true,lastSha:pending.remoteSha,lastRevision:data.dataRevision,lastHash:pending.remoteHash,lastSyncedAt:nowIso(),pending:false,pendingChanges:0,retryCount:0,errorType:null,errorMessage:null});
      }else if(choice==='replace'){
        const result=await putGithubData(pending.remoteSha,data);Object.assign(config.github,{connected:true,lastSha:result.content.sha,lastRevision:data.dataRevision,lastHash:await contentHash(data),lastSyncedAt:nowIso(),pending:false,pendingChanges:0,retryCount:0,errorType:null,errorMessage:null});
      }else return;
      config.setupComplete=true;pendingGithubRestore=null;await saveConfig();switchTab('home');showToast(choice==='restore'?'GitHub backup restored.':'GitHub backup replaced with this phone copy.');
    }catch(error){showToast(`Could not complete GitHub setup: ${error.message}`,null,null,7000);}
  }


  async function syncNow(reason='manual',force=false){
    if(syncRunning||!config.github.connected||!config.github.token)return;
    if(!isOnline()){config.github.errorType=null;await saveConfig();render();return;}
    if(!config.github.pending&&!force&&reason!=='startup')return;
    syncRunning=true;render();
    const uploadRevision=data.dataRevision;const uploadData=deepClone(data);
    try{
      const remote=await fetchGithubData();
      if(remote.exists){
        const check=validateData(remote.data);if(!check.valid)throw Object.assign(new Error(`GitHub backup is invalid: ${check.errors.join(' ')}`),{type:'invalid'});
        normaliseLoadedData(remote.data);ensureHistoricalWeekTargets(remote.data);remote.hash=await contentHash(remote.data);
        const remoteChangedUnexpectedly=Boolean(config.github.lastSha&&remote.sha!==config.github.lastSha);
        const remoteMatchesLast=Boolean(config.github.lastHash&&remote.hash===config.github.lastHash);
        const remoteMatchesLocal=remote.hash===await contentHash(data);
        if(remoteChangedUnexpectedly&&!remoteMatchesLast&&!remoteMatchesLocal){
          if(!config.github.pending&&Number(remote.data.dataRevision)>Number(data.dataRevision)){
            data=remote.data;await saveDataRaw();config.github.lastSha=remote.sha;config.github.lastRevision=remote.data.dataRevision;config.github.lastHash=remote.hash;config.github.lastSyncedAt=nowIso();await saveConfig();return;
          }
          config.conflict={localData:deepClone(data),remoteData:deepClone(remote.data),remoteSha:remote.sha,createdAt:nowIso()};await saveConfig();currentScreen={name:'conflict',params:{}};return;
        }
        if(remoteChangedUnexpectedly&&(remoteMatchesLast||remoteMatchesLocal)){config.github.lastSha=remote.sha;config.github.lastHash=remote.hash;}
        if(remoteMatchesLocal){config.github.lastSha=remote.sha;config.github.lastRevision=data.dataRevision;config.github.lastHash=remote.hash;config.github.lastSyncedAt=nowIso();config.github.pending=false;config.github.pendingChanges=0;config.github.retryCount=0;config.github.errorType=null;config.github.errorMessage=null;await saveConfig();return;}
        if(!config.github.pending&&Number(remote.data.dataRevision)>Number(data.dataRevision)){data=remote.data;await saveDataRaw();config.github.lastSha=remote.sha;config.github.lastRevision=remote.data.dataRevision;config.github.lastHash=remote.hash;config.github.lastSyncedAt=nowIso();await saveConfig();return;}
      }
      const result=await putGithubData(remote.sha,uploadData);const hash=await contentHash(uploadData);
      config.github.lastSha=result.content.sha;config.github.lastRevision=uploadRevision;config.github.lastHash=hash;config.github.lastSyncedAt=nowIso();config.github.retryCount=0;config.github.errorType=null;config.github.errorMessage=null;
      if(data.dataRevision===uploadRevision){config.github.pending=false;config.github.pendingChanges=0;}else{config.github.pending=true;scheduleSync();}
      await saveConfig();
      setTimeout(()=>purgeExpiredDeletedItems(),0);
      if(reason==='manual')showToast('Backup completed.');
    }catch(error){
      const auth=[401,403].includes(error.status);config.github.errorType=auth?'auth':error.type==='invalid'?'invalid':'temporary';config.github.errorMessage=error.message;await saveConfig();
      if(!auth&&error.type!=='invalid')scheduleRetry();
      if(reason==='manual')showToast(`Backup failed: ${error.message}`,null,null,7000);
    }finally{syncRunning=false;render();}
  }

  function scheduleRetry(){clearTimeout(retryTimer);const index=Number(config.github.retryCount||0);if(index>=RETRY_DELAYS.length)return;const delay=RETRY_DELAYS[index];config.github.retryCount=index+1;saveConfig();retryTimer=setTimeout(()=>syncNow('retry'),delay);}
  async function disconnectGithub(){if(config.github.pending&&!confirm('Some changes have not backed up. Disconnect GitHub and keep using the local copy?'))return;Object.assign(config.github,makeDefaultConfig().github);config.conflict=null;await saveConfig();render();showToast('GitHub disconnected. Local data is unchanged.');}

  async function resolveConflict(choice){
    const c=config.conflict;if(!c)return;
    downloadJson(c.localData,`workout-phone-copy-${todayLocal()}.json`);downloadJson(c.remoteData,`workout-github-copy-${todayLocal()}.json`);
    if(choice==='remote'){
      data=normaliseLoadedData(c.remoteData);ensureHistoricalWeekTargets(data);await saveDataRaw();config.github.lastSha=c.remoteSha;config.github.lastRevision=data.dataRevision;config.github.lastHash=await contentHash(data);config.github.pending=false;config.github.pendingChanges=0;config.conflict=null;await saveConfig();switchTab('home');showToast('GitHub copy restored.');
    }else{
      data=c.localData;await saveDataRaw();config.github.lastSha=c.remoteSha;config.github.pending=true;config.github.pendingChanges=Math.max(1,config.github.pendingChanges);config.conflict=null;await saveConfig();switchTab('home');await syncNow('conflict-local',true);showToast('Phone copy selected and queued for backup.');
    }
  }

  function afterRender(){
    if(currentScreen.name==='exerciseProgress')drawExerciseChart();
    if(currentScreen.name==='bodyweight')drawBodyweightChart();
  }
  function chartColors(){const style=getComputedStyle(document.documentElement);return{accent:style.getPropertyValue('--accent').trim(),text:style.getPropertyValue('--muted').trim(),line:style.getPropertyValue('--line').trim(),surface:style.getPropertyValue('--surface').trim()};}
  function prepareCanvas(canvas,height=230){if(!canvas)return null;const rect=canvas.getBoundingClientRect();const ratio=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.floor(rect.width*ratio));canvas.height=Math.floor(height*ratio);canvas.style.height=`${height}px`;const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);return{ctx,width:rect.width,height};}
  function drawLineChart(canvas,seriesList,labels,formatter=v=>formatNumber(v)){
    const prep=prepareCanvas(canvas);if(!prep)return;const{ctx,width,height}=prep,c=chartColors();const pad={l:44,r:12,t:18,b:34};const all=seriesList.flatMap(s=>s.values.filter(v=>Number.isFinite(v)));if(!all.length)return;let min=Math.min(...all),max=Math.max(...all);if(min===max){min=Math.max(0,min-1);max+=1;}const x=i=>pad.l+(labels.length===1?(width-pad.l-pad.r)/2:i/(labels.length-1)*(width-pad.l-pad.r));const y=v=>pad.t+(max-v)/(max-min)*(height-pad.t-pad.b);
    ctx.clearRect(0,0,width,height);ctx.strokeStyle=c.line;ctx.fillStyle=c.text;ctx.font='11px -apple-system, sans-serif';ctx.textAlign='right';for(let i=0;i<=4;i++){const val=min+(max-min)*(4-i)/4;const yy=pad.t+i*(height-pad.t-pad.b)/4;ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(width-pad.r,yy);ctx.stroke();ctx.fillText(formatter(val),pad.l-7,yy+4);}ctx.textAlign='center';const step=Math.max(1,Math.ceil(labels.length/4));labels.forEach((lab,i)=>{if(i%step===0||i===labels.length-1)ctx.fillText(lab,x(i),height-12);});
    seriesList.forEach((series,si)=>{ctx.strokeStyle=series.color||c.accent;ctx.globalAlpha=series.alpha??1;ctx.lineWidth=series.width||2.5;ctx.beginPath();series.values.forEach((v,i)=>{if(!Number.isFinite(v))return;const xx=x(i),yy=y(v);if(i===0||!Number.isFinite(series.values[i-1]))ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);});ctx.stroke();series.values.forEach((v,i)=>{if(!Number.isFinite(v))return;ctx.fillStyle=series.color||c.accent;ctx.beginPath();ctx.arc(x(i),y(v),3,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;});
  }
  function drawExerciseChart(){const canvas=document.getElementById('exercise-volume-chart');if(!canvas)return;const id=currentScreen.params.exerciseId,range=currentScreen.params.range||data.settings.defaultChartRange;const sessions=filterByRange(completedWorkouts().map(w=>({date:w.workoutDate,value:exerciseStatsInWorkout(w,id).volume})).filter(x=>x.value>0),'date',range);drawLineChart(canvas,[{values:sessions.map(x=>x.value)}],sessions.map(x=>dateToLocalString(x.date,{year:false})),v=>formatNumber(v));}
  function drawBodyweightChart(){const canvas=document.getElementById('bodyweight-chart');if(!canvas)return;const range=currentScreen.params.range||data.settings.defaultChartRange,entries=filterByRange(visibleBodyweights(),'date',range);const averages=entries.map(x=>bodyweightRollingAverage(visibleBodyweights(),x.date));drawLineChart(canvas,[{values:entries.map(x=>Number(x.weightKg))},{values:averages,alpha:.45,width:3}],entries.map(x=>dateToLocalString(x.date,{year:false})),v=>formatNumber(v,1));}

  initialise();
})();
